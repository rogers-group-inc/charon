name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Guard so CI stays green during early scaffolding (no package.json yet).
      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet — skipping lint/test (scaffolding phase)."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        # postinstall runs `prisma generate`, and prisma.config.ts refuses to load
        # without DATABASE_URL. Generate never connects, so a placeholder is enough.
        # Scoped to this step only: set job-wide it would make DB-gated tests try
        # to connect instead of skipping.
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: npm run typecheck --if-present

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: npm test --if-present
