# Charon — dev compose. Single-process app (CHARON_ROLE unset = "all") with a
# bind-mounted source tree + a local Postgres. Bound to 127.0.0.1 only.
#
#   podman compose -f compose.dev.yml -p charon-<slug> up -d --build
#
# One stack per worktree: -p isolates containers + volumes, and
# CHARON_DEV_PG_PORT / CHARON_DEV_APP_PORT move the published ports off the
# 5432 / 3000 defaults so stacks can run side by side
# (.claude/skills/charon-worktree-workflow/references/dev-environment.md).

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: charon
      POSTGRES_PASSWORD: charon
      POSTGRES_DB: charon
    ports:
      - "127.0.0.1:${CHARON_DEV_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charon"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - charon-dev-db:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://charon:charon@postgres:5432/charon
      SESSION_SECRET: dev-only-secret-change-me
      CHARON_DATA_KEY: ZGV2LW9ubHktMzItYnl0ZS1rZXktZGV2LW9ubHkteHg=   # throwaway, exactly 32 bytes
      NODE_ENV: development
      CHARON_BIND: "0.0.0.0"
    ports:
      - "127.0.0.1:${CHARON_DEV_APP_PORT:-3000}:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./prisma:/app/prisma
      - charon-dev-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  charon-dev-db:
  charon-dev-modules:
