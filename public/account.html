<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charon — My Account</title>
  <script src="/js/theme-init.js"></script>
  <link rel="expect" href="#polaris-nav-ready" blocking="render">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/page-transitions.css">
  <link rel="stylesheet" href="/css/charon.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <h2>My Account</h2>
      </div>
      <!-- Every signed-in operator, whatever their role: the self-service half
           of Users (own password, own two-factor auth, own passkeys). -->
      <div class="settings-cards-flow" id="account-cards">
        <div class="empty-state">Loading...</div>
      </div>
    </main>
  </div>

  <!-- A polaris-port page (the self-service modals come from polaris):
       settings-api.js replaces Charon's api.js, as on Users. -->
  <script src="/js/settings-api.js"></script>
  <script src="/js/panel-lock.js"></script>
  <script src="/js/brand-logo.js"></script>
  <script src="/js/app.js"></script>
  <span id="polaris-nav-ready" hidden></span>
  <script src="/js/settings-ui.js"></script>
  <script src="/js/password-self.js"></script>
  <script src="/js/totp-self.js"></script>
  <script src="/js/webauthn.js"></script>
  <script src="/js/passkeys-self.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
