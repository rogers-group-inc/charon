<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charon — Integrations</title>
  <script src="/js/theme-init.js"></script>
  <link rel="expect" href="#polaris-nav-ready" blocking="render">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/page-transitions.css">
  <link rel="stylesheet" href="/css/charon.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-top-sticky">
      <div class="page-header">
        <h2>Integrations</h2>
        <div class="page-header-actions" id="page-header-actions"></div>
      </div>

      <!-- Folder tabs over one page-sized card (polaris's Integrations layout,
           styles.css "Folder CARD"). One tab today; the strip is where a second
           panel slots in. -->
      <div class="table-head-row folder-head-card">
        <div class="page-tabs page-tabs-glass" id="integration-tabs">
          <button class="page-tab active" data-tab="integrations">Integrations</button>
        </div>
        <!-- + Add Integration sits at the card's top right (polaris). -->
        <div class="table-head-controls">
          <button class="btn btn-primary" id="btn-add-integration" style="display:none">+ Add Integration</button>
        </div>
      </div>
      </div>

      <div class="folder-card folder-body">
      <div class="folder-card-scroll">
      <div class="page-tab-panel active" id="tab-integrations">
        <div id="integrations-health"></div>
        <div id="integrations-list">
          <p class="empty-state">Loading...</p>
        </div>
      </div>
      </div>
      </div>
    </main>
  </div>

  <script src="/js/page-top-curtain.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/folder-tabs.js"></script>
  <script src="/js/brand-logo.js"></script>
  <script src="/js/app.js"></script>
  <span id="polaris-nav-ready" hidden></span>
  <script src="/js/integrations.js"></script>
</body>
</html>
