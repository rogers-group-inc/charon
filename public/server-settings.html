<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charon — Server Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="/js/theme-init.js"></script>
  <link rel="expect" href="#polaris-nav-ready" blocking="render">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/page-transitions.css">
  <link rel="stylesheet" href="/css/charon.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-top-sticky">
      <div class="page-header">
        <h2>Server Settings</h2>
      </div>

      <!-- Folder tabs (styles.css "Table head row") over one page-sized card
           (.folder-card) that holds every tab's panel — the tabs open into it.
           folder-head-card: the tab takes the card's glass, not a table
           header's fill (folder-tabs.js gives each tab the .tab-glass layer
           that carries it). Ported from polaris; "Authentication" is Charon's
           own (login mode, which also drives the agent login GUI). -->
      <div class="table-head-row folder-head-card">
        <div class="page-tabs page-tabs-glass" id="settings-tabs">
          <button class="page-tab active" data-tab="identification">Identification</button>
          <button class="page-tab" data-tab="credentials">Credentials</button>
          <button class="page-tab" data-tab="firmware">Repository</button>
          <button class="page-tab" data-tab="customization">Customization</button>
          <button class="page-tab" data-tab="ntp">Time &amp; NTP</button>
          <button class="page-tab" data-tab="certificates">Web Server</button>
          <button class="page-tab" data-tab="auth">Authentication</button>
          <button class="page-tab" data-tab="maintenance">Maintenance</button>
          <button class="page-tab" data-tab="retention">Retention</button>
          <button class="page-tab" data-tab="api-tokens">API Tokens</button>
          <button class="page-tab" data-tab="ha">High Availability</button>
        </div>
      </div>
      </div>

      <!-- The card stays put and its panels scroll INSIDE it
           (.folder-card-scroll), so its rounded top edge, the folder join and
           its ring shadow never slide under the pinned header. -->
      <div class="folder-card folder-body">
        <div class="folder-card-scroll">
          <div class="page-tab-panel active" id="tab-identification"></div>
          <div class="page-tab-panel" id="tab-credentials"></div>
          <div class="page-tab-panel" id="tab-firmware"></div>
          <div class="page-tab-panel" id="tab-customization"></div>
          <div class="page-tab-panel" id="tab-ntp"></div>
          <div class="page-tab-panel" id="tab-certificates"></div>
          <div class="page-tab-panel" id="tab-auth"></div>
          <div class="page-tab-panel" id="tab-maintenance"></div>
          <div class="page-tab-panel" id="tab-retention"></div>
          <div class="page-tab-panel" id="tab-api-tokens"></div>
          <div class="page-tab-panel" id="tab-ha"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/page-top-curtain.js"></script>
  <!-- settings-api.js is polaris's api.js (api.<namespace>.*, showToast,
       escapeHtml, …); it replaces Charon's api.js on this page only. -->
  <script src="/js/settings-api.js"></script>
  <script src="/js/folder-tabs.js"></script>
  <script src="/js/panel-lock.js"></script>
  <script src="/js/brand-logo.js"></script>
  <script src="/js/app.js"></script>
  <span id="polaris-nav-ready" hidden></span>
  <script src="/js/settings-ui.js"></script>
  <!-- Tag auto-assign device filter (Add/Edit Tag): the shared nested AND/OR
       condition builder. -->
  <script src="/js/condition-builder.js"></script>
  <script src="/js/server-settings-ha.js"></script>
  <script src="/js/server-settings-firmware.js"></script>
  <script src="/js/pinned-tls-certs.js"></script>
  <script src="/js/server-settings-ntp.js"></script>
  <script src="/js/server-settings-identification.js"></script>
  <script src="/js/server-settings-webserver.js"></script>
  <script src="/js/server-settings-maintenance.js"></script>
  <script src="/js/server-settings-customization.js"></script>
  <script src="/js/server-settings-credentials.js"></script>
  <script src="/js/server-settings-api-tokens.js"></script>
  <script src="/js/server-settings-auth.js"></script>
  <script src="/js/server-settings.js"></script>
</body>
</html>
