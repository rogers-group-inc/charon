<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charon — Users</title>
  <script src="/js/theme-init.js"></script>
  <link rel="expect" href="#polaris-nav-ready" blocking="render">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/page-transitions.css">
  <link rel="stylesheet" href="/css/charon.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <h2>Users</h2>
        <div class="page-header-actions"></div>
      </div>

      <!-- Ported from polaris. Action buttons sit on their own row above the
           Users table, right aligned. Each is shown by users.js only when the
           caller's role carries the key its route checks. -->
      <div class="page-actions-row">
        <button class="btn btn-secondary" id="btn-auth-settings" style="display:none">Authentication</button>
        <button class="btn btn-secondary" id="btn-clear-filters" title="Clear every column filter on the Users list">Clear Filters</button>
        <button class="btn btn-primary" id="btn-add-user">+ Add User</button>
      </div>

      <div class="glass-table-card" id="users-card"><div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <!-- Online-status dot: a fixed-size token, so static-width. -->
              <th style="width:24px" data-col-id="avatar" data-col-required="true" data-col-no-resize="true"></th>
              <th data-sf-key="username"        data-sf-type="string">Username</th>
              <th data-sf-key="authProvider"    data-sf-type="string">Auth</th>
              <th data-sf-key="role.name"       data-sf-type="string">Role</th>
              <th data-sf-key="totpEnabledSort" data-sf-type="string">2FA</th>
              <th data-sf-key="lastLogin"       data-sf-type="date">Last Login</th>
              <th style="width:110px" data-sf-key="createdAt" data-sf-type="date">Created</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr><td colspan="7" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div></div>

      <!-- Roles — roles:read. Lists every editable role (the protected
           Administrator is hidden); the name opens the permission slide-over. -->
      <section id="roles-section" style="margin-top:2.5rem;display:none">
        <div class="page-header" style="margin-bottom:1rem">
          <h2 style="font-size:1.15rem;margin:0">Roles</h2>
          <div class="page-header-actions">
            <button class="btn btn-primary" id="btn-add-role">+ Add Role</button>
          </div>
        </div>
        <div class="glass-table-card"><div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th data-col-id="name" data-col-required="true">Name</th>
                <th data-col-id="description">Description</th>
                <th style="width:120px" data-col-id="users">Users</th>
                <th style="width:120px" data-col-id="builtIn">Built-in</th>
              </tr>
            </thead>
            <tbody id="roles-tbody">
              <tr><td colspan="4" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div></div>
      </section>

      <!-- IdP group → role mappings — users:fullwrite. Highest-privilege role
           wins when a user is in several mapped groups. -->
      <section id="group-mappings-section" style="margin-top:2.5rem;display:none">
        <div class="page-header" style="margin-bottom:0.5rem">
          <h2 style="font-size:1.15rem;margin:0">Group Mappings</h2>
          <div class="page-header-actions">
            <button class="btn btn-primary" id="btn-add-group-mapping">+ Add Mapping</button>
          </div>
        </div>
        <div class="glass-table-card"><div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th style="width:90px" data-col-id="provider" data-col-required="true">Provider</th>
                <th data-col-id="group">Group</th>
                <th style="width:160px" data-col-id="role">Role</th>
                <th style="width:90px" data-col-id="enabled">Enabled</th>
              </tr>
            </thead>
            <tbody id="group-mappings-tbody">
              <tr><td colspan="4" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div></div>
      </section>
    </main>
  </div>

  <!-- Permissions slide-over (built on first open) -->
  <div id="role-slideover-mount"></div>

  <!-- A polaris-port page: settings-api.js (api.<namespace>.*) replaces
       Charon's api.js here, as on Server Settings. -->
  <script src="/js/settings-api.js"></script>
  <script src="/js/panel-lock.js"></script>
  <script src="/js/brand-logo.js"></script>
  <script src="/js/app.js"></script>
  <span id="polaris-nav-ready" hidden></span>
  <script src="/js/settings-ui.js"></script>
  <script src="/js/table-sf.js"></script>
  <script src="/js/row-menu.js"></script>
  <script src="/js/password-self.js"></script>
  <script src="/js/totp-self.js"></script>
  <script src="/js/webauthn.js"></script>
  <script src="/js/passkeys-self.js"></script>
  <script src="/js/users.js"></script>
</body>
</html>
